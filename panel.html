<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>API HUB | پنل کاربری</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,130,255,.14),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(0,80,255,.12),transparent 30%),
        #050914;
}

header{
    height:72px;
    padding:0 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(3,7,18,.85);
    backdrop-filter:blur(20px);
}

.logo{
    font-size:27px;
    font-weight:900;
}

.logo span{
    color:#119cff;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-name{
    color:#63caff;
    font-weight:bold;
}

.btn{
    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;
    padding:10px 17px;
    background:rgba(255,255,255,.06);
    color:#fff;
    cursor:pointer;
}

.container{
    width:min(1100px,92%);
    margin:auto;
    padding:50px 0;
}

.welcome{
    margin-bottom:30px;
}

.welcome h1{
    font-size:36px;
    margin-bottom:10px;
}

.welcome p{
    color:#91a0b7;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}

.card{
    padding:25px;
    border-radius:22px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.card-title{
    color:#8f9db3;
    font-size:14px;
    margin-bottom:15px;
}

.card-value{
    color:#5dcaff;
    font-size:30px;
    font-weight:bold;
}

.section{
    padding:28px;
    border-radius:22px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
}

.section h2{
    margin-bottom:22px;
}

.empty{
    color:#8794a9;
    text-align:center;
    padding:30px;
}

.api-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px;
    margin-bottom:12px;
    border-radius:14px;
    background:rgba(255,255,255,.045);
}

.api-info strong{
    display:block;
    margin-bottom:7px;
}

.api-info span{
    color:#7e8da4;
    font-size:13px;
}

.api-key{
    direction:ltr;
    font-family:monospace;
    color:#55caff;
}

@media(max-width:750px){

    .grid{
        grid-template-columns:1fr;
    }

    header{
        padding:0 20px;
    }

    .user-name{
        display:none;
    }

    .welcome h1{
        font-size:28px;
    }
}

</style>
</head>


<body>

<header>

    <div class="logo">
        API <span>HUB</span>
    </div>

    <div class="header-left">

        <span
            class="user-name"
            id="userName">
            در حال دریافت...
        </span>

        <button
            class="btn"
            onclick="goHome()">
            API ها
        </button>

        <button
            class="btn"
            onclick="logout()">
            خروج
        </button>

    </div>

</header>


<main class="container">

    <div class="welcome">

        <h1>
            پنل کاربری 👋
        </h1>

        <p id="email">
            در حال دریافت اطلاعات حساب...
        </p>

    </div>


    <div class="grid">

        <div class="card">

            <div class="card-title">
                API های خریداری‌شده
            </div>

            <div
                class="card-value"
                id="apiCount">
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                درخواست‌های استفاده‌شده
            </div>

            <div
                class="card-value">
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                وضعیت حساب
            </div>

            <div
                class="card-value"
                style="font-size:20px;">
                فعال ✓
            </div>

        </div>

    </div>


    <div class="section">

        <h2>
            🔑 API های من
        </h2>

        <div
            id="purchases"
            class="empty">
            در حال دریافت...
        </div>

    </div>

</main>


<script>

const API_BASE =
"https://api-hub-backend.mirzaeiabolfazl908.workers.dev";


/* =========================
   CURRENT USER
========================= */

async function loadUser(){

    try{

        const response =
        await fetch(
            API_BASE + "/api/me",
            {
                credentials:"include"
            }
        );

        const data =
        await response.json();

        if(
            !data.success ||
            !data.user
        ){

            window.location.href =
            "index.html";

            return;
        }

        document.getElementById("userName")
        .textContent =
        data.user.name;

        document.getElementById("email")
        .textContent =
        data.user.email;

    }catch(error){

        console.error(error);

        window.location.href =
        "index.html";
    }
}


/* =========================
   PURCHASES
========================= */

async function loadPurchases(){

    try{

        const response =
        await fetch(
            API_BASE + "/api/my-purchases",
            {
                credentials:"include"
            }
        );

        const data =
        await response.json();

        const container =
        document.getElementById("purchases");

        if(
            !data.success ||
            !data.purchases ||
            data.purchases.length === 0
        ){

            container.innerHTML =
            "هنوز هیچ API خریداری نکرده‌اید.";

            document.getElementById("apiCount")
            .textContent = "0";

            return;
        }

        document.getElementById("apiCount")
        .textContent =
        data.purchases.length;

        container.innerHTML =
        data.purchases.map(p => `

            <div class="api-item">

                <div class="api-info">

                    <strong>
                        ${p.product_name}
                    </strong>

                    <span>
                        خریداری شده در:
                        ${p.created_at || "-"}
                    </span>

                </div>

                <div class="api-key">
                    ${p.api_key}
                </div>

            </div>

        `).join("");

    }catch(error){

        console.error(error);

        document.getElementById("purchases")
        .textContent =
        "خطا در دریافت API های خریداری‌شده.";
    }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

    try{

        await fetch(
            API_BASE + "/api/logout",
            {
                method:"POST",
                credentials:"include"
            }
        );

    }catch(error){

        console.error(error);
    }

    window.location.href =
    "index.html";
}


/* =========================
   HOME
========================= */

function goHome(){

    window.location.href =
    "index.html";
}


/* =========================
   START
========================= */

loadUser();
loadPurchases();

</script>

</body>
</html>
