<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>API HUB | اطلاعات API</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    color:white;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,140,255,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,80,255,.10),transparent 30%),
        #050914;
}

.header{
    height:72px;
    padding:0 8%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(4,8,18,.8);
    backdrop-filter:blur(20px);
}

.logo{
    font-size:28px;
    font-weight:900;
}

.logo span{
    color:#149cff;
}

.user{
    display:flex;
    align-items:center;
    gap:15px;
}

.user-name{
    color:#65c8ff;
    font-weight:bold;
}

.logout{
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;
    background:rgba(255,255,255,.06);
    color:white;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:70px 25px;
}

.back{
    display:inline-block;
    color:#66c9ff;
    text-decoration:none;
    margin-bottom:30px;
}

.card{
    padding:45px;
    border-radius:28px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.08),
        rgba(255,255,255,.025)
    );
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 80px rgba(0,0,0,.35);
}

.icon{
    width:90px;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:25px;
    background:rgba(0,140,255,.13);
    font-size:45px;
    margin-bottom:25px;
}

h1{
    font-size:42px;
    margin-bottom:15px;
}

.description{
    color:#aab6ca;
    line-height:2;
    font-size:17px;
    margin-bottom:35px;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:35px;
}

.info-box{
    padding:22px;
    border-radius:16px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
}

.label{
    color:#8996aa;
    font-size:13px;
    margin-bottom:10px;
}

.value{
    color:#55c7ff;
    font-size:20px;
    font-weight:bold;
}

.buy{
    width:100%;
    padding:18px;
    border:0;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-size:17px;
    font-weight:bold;
    background:linear-gradient(135deg,#087cff,#00b7ff);
    box-shadow:0 12px 35px rgba(0,140,255,.25);
}

.buy:hover{
    transform:translateY(-2px);
}

.buy:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:20px;
    color:#7dd3fc;
}

.key-box{
    display:none;
    margin-top:30px;
    padding:25px;
    border-radius:18px;
    background:rgba(0,200,120,.08);
    border:1px solid rgba(0,220,150,.2);
}

.key-box h3{
    margin-bottom:15px;
}

.api-key{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    padding:16px;
    border-radius:12px;
    background:#030711;
    color:#65d5ff;
    font-family:monospace;
    margin-bottom:15px;
}

.copy{
    padding:11px 18px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    background:#0c9cff;
    color:white;
    font-weight:bold;
}

@media(max-width:700px){

    .header{
        padding:0 20px;
    }

    .container{
        padding:40px 15px;
    }

    .card{
        padding:25px;
    }

    h1{
        font-size:32px;
    }

    .info{
        grid-template-columns:1fr;
    }

    .user-name{
        display:none;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        API <span>HUB</span>
    </div>

    <div class="user">
        <span class="user-name" id="userName"></span>

        <button
            class="logout"
            onclick="logout()">
            خروج
        </button>
    </div>

</header>


<main class="container">

    <a
        href="index.html"
        class="back">
        ← بازگشت به API ها
    </a>

    <div class="card">

        <div
            class="icon"
            id="icon">
            🔌
        </div>

        <h1 id="productName">
            در حال دریافت...
        </h1>

        <div
            class="description"
            id="description">
            لطفاً صبر کنید...
        </div>

        <div class="info">

            <div class="info-box">

                <div class="label">
                    قیمت
                </div>

                <div
                    class="value"
                    id="price">
                    -
                </div>

            </div>

            <div class="info-box">

                <div class="label">
                    تعداد درخواست
                </div>

                <div
                    class="value"
                    id="requests">
                    -
                </div>

            </div>

            <div class="info-box">

                <div class="label">
                    دسته‌بندی
                </div>

                <div
                    class="value"
                    id="category">
                    -
                </div>

            </div>

        </div>

        <button
            class="buy"
            id="buyButton"
            onclick="purchaseAPI()">
            خرید API
        </button>

        <div
            class="message"
            id="message">
        </div>

        <div
            class="key-box"
            id="keyBox">

            <h3>
                🎉 API Key شما آماده است
            </h3>

            <div
                class="api-key"
                id="apiKey">
            </div>

            <button
                class="copy"
                onclick="copyKey()">
                کپی API Key
            </button>

        </div>

    </div>

</main>


<script>

const API_BASE =
    "https://api-hub-backend.mirzaeiabolfazl908.workers.dev";

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    Number(params.get("id"));

let product = null;


/* =========================
   ICON
========================= */

function getIcon(name){

    const icons = {
        "AI Text API":"🤖",
        "Data API":"📊",
        "Utility API":"⚙️",
        "Vision API":"🧠",
        "Web Data API":"🌐",
        "Security API":"🔐"
    };

    return icons[name] || "🔌";
}


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){

    if(!productId){

        showMessage(
            "شناسه API نامعتبر است."
        );

        return;
    }

    try{

        const response =
            await fetch(
                API_BASE + "/api/products"
            );

        const products =
            await response.json();

        product =
            products.find(
                p => Number(p.id) === productId
            );

        if(!product){

            showMessage(
                "API موردنظر پیدا نشد."
            );

            return;
        }

        document.getElementById("icon")
            .textContent =
            getIcon(product.name);

        document.getElementById("productName")
            .textContent =
            product.name;

        document.getElementById("description")
            .textContent =
            product.description ||
            "API قدرتمند و آماده استفاده برای پروژه‌های شما.";

        document.getElementById("price")
            .textContent =
            Number(product.price)
            .toLocaleString("fa-IR") +
            " تومان";

        document.getElementById("requests")
            .textContent =
            product.requests ||
            "درخواست";

        document.getElementById("category")
            .textContent =
            product.category ||
            "عمومی";

    }catch(error){

        console.error(error);

        showMessage(
            "خطا در دریافت اطلاعات API."
        );
    }
}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin(){

    try{

        const response =
            await fetch(
                API_BASE + "/api/me",
                {
                    credentials:"include"
                }
            );

        const data =
            await response.json();

        if(
            data.success &&
            data.user
        ){

            document.getElementById("userName")
                .textContent =
                data.user.name ||
                data.user.email;

            return true;
        }

        document.getElementById("userName")
            .textContent =
            "وارد نشده";

        return false;

    }catch(error){

        console.error(error);

        return false;
    }
}


/* =========================
   PURCHASE
========================= */

async function purchaseAPI(){

    if(!product){

        showMessage(
            "اطلاعات API هنوز آماده نیست."
        );

        return;
    }

    const loggedIn =
        await checkLogin();

    if(!loggedIn){

        showMessage(
            "ابتدا وارد حساب خود شوید."
        );

        setTimeout(() => {

            window.location.href =
                "index.html";

        },1200);

        return;
    }

    const button =
        document.getElementById("buyButton");

    button.disabled = true;

    button.textContent =
        "در حال ثبت خرید...";

    showMessage("");

    try{

        const response =
            await fetch(
                API_BASE + "/api/purchase",
                {
                    method:"POST",
                    credentials:"include",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        productId:
                            product.id
                    })
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            data.success === false
        ){

            showMessage(
                data.message ||
                "خرید انجام نشد."
            );

            button.disabled = false;

            button.textContent =
                "خرید API";

            return;
        }

        showMessage(
            "خرید با موفقیت ثبت شد! 🎉"
        );

        document.getElementById("keyBox")
            .style.display =
            "block";

        document.getElementById("apiKey")
            .textContent =
            data.purchase.apiKey;

        button.textContent =
            "خرید انجام شد";

    }catch(error){

        console.error(error);

        showMessage(
            "ارتباط با سرور برقرار نشد."
        );

        button.disabled = false;

        button.textContent =
            "خرید API";
    }
}


/* =========================
   COPY KEY
========================= */

async function copyKey(){

    const key =
        document.getElementById("apiKey")
        .textContent;

    try{

        await navigator.clipboard.writeText(key);

        showMessage(
            "API Key کپی شد. ✅"
        );

    }catch(error){

        showMessage(
            "کپی خودکار انجام نشد."
        );
    }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

    try{

        await fetch(
            API_BASE + "/api/logout",
            {
                method:"POST",
                credentials:"include"
            }
        );

    }catch(error){

        console.error(error);
    }

    window.location.href =
        "index.html";
}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    document.getElementById("message")
        .textContent = text;
}


/* =========================
   START
========================= */

loadProduct();
checkLogin();

</script>

</body>
</html>
